<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Intellytiq Solutions</title>
<link rel="stylesheet" href="../assets/css/style.css?v=6d502b02">
<link rel="icon" type="image/svg+xml" href="../assets/img/logo-mark.svg">
<link rel="stylesheet" href="admin.css?v=59806a72">
</head>
<body class="adm">
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <div class="logo" style="justify-content:center;margin-bottom:8px"><img src="../assets/img/logo-mark.svg" alt="" width="48" height="48"><span>Intellytiq<small>ADMIN</small></span></div>
    <h2 style="font-size:26px;text-align:center">Sign in</h2>
    <label>User ID<input name="user" autocomplete="username" required autofocus></label>
    <label>Password<input name="pass" type="password" autocomplete="current-password" required></label>
    <div data-captcha id="loginCap"></div>
    <div class="note" id="loginNote" role="alert"></div>
    <button class="btn primary" style="justify-content:center">Sign in</button>
    <a href="../index.html" class="muted" style="text-align:center;font-size:14px">← Back to website</a>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <a class="logo" href="../index.html"><img src="../assets/img/logo-mark.svg" alt="" width="34" height="34"><span>Intellytiq<small>ADMIN</small></span></a>
    <nav id="tabs"></nav>
    <div class="sidefoot"><a href="../index.html" target="_blank" rel="noopener">View site ↗</a><button id="logout">Sign out</button></div>
  </aside>
  <main class="mainp">
    <div id="warn" class="warn" hidden>⚠ You are using the default password. Change it now under <a href="#security">Security</a>.</div>
    <header class="ptop"><div><h1 id="ptitle"></h1><p class="muted" id="psub"></p></div><div id="pact" class="pact"></div></header>
    <div id="panel"></div>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="../assets/js/captcha.js?v=fcdc2df1"></script>
<script src="admin.js?v=11e4f5d1"></script>
</body>
</html>
