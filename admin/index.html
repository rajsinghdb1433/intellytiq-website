<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Intellytiq Solutions</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adm">
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <div class="logo" style="justify-content:center;margin-bottom:8px"><svg viewBox="0 0 48 48" width="42" height="42"><defs><linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs><path d="M24 3 42 13.500v21L24 45 6 34.500v-21L24 3Z" fill="none" stroke="url(#al)" stroke-width="2.600"/><circle cx="24" cy="24" r="4" fill="url(#al)"/></svg><span>Intellytiq<small>ADMIN</small></span></div>
    <h2 style="font-size:26px;text-align:center">Sign in</h2>
    <label>User ID<input name="user" autocomplete="username" required autofocus></label>
    <label>Password<input name="pass" type="password" autocomplete="current-password" required></label>
    <div class="note" id="loginNote" role="alert"></div>
    <button class="btn primary" style="justify-content:center">Sign in</button>
    <a href="../index.html" class="muted" style="text-align:center;font-size:14px">← Back to website</a>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <a class="logo" href="../index.html"><svg viewBox="0 0 48 48" width="30" height="30"><path d="M24 3 42 13.500v21L24 45 6 34.500v-21L24 3Z" fill="none" stroke="#22d3ee" stroke-width="3"/><circle cx="24" cy="24" r="4" fill="#d946ef"/></svg><span>Intellytiq<small>ADMIN</small></span></a>
    <nav id="tabs"></nav>
    <div class="sidefoot"><a href="../index.html" target="_blank" rel="noopener">View site ↗</a><button id="logout">Sign out</button></div>
  </aside>
  <main class="mainp">
    <div id="warn" class="warn" hidden>⚠ You are using the default password. Change it now under <a href="#security">Security</a>.</div>
    <header class="ptop"><div><h1 id="ptitle"></h1><p class="muted" id="psub"></p></div><div id="pact" class="pact"></div></header>
    <div id="panel"></div>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
