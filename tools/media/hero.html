<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#eef3ff}canvas{display:block}</style><canvas id="c" width="1280" height="720"></canvas>
<script>
// Light hero loop. Everything is a periodic function of t (seconds), period T, so frame 0 == frame T.
const T=8, W=1280, H=720, c=document.getElementById('c'), x=c.getContext('2d'), TAU=Math.PI*2;
let s=7; const rnd=()=>((s=Math.imul(s^s>>>15,2246822507)^Math.imul(s^s>>>13,3266489909))>>>0)/4294967296;
const N=54, nodes=Array.from({length:N},()=>({bx:rnd()*W,by:rnd()*H,r:14+rnd()*40,k:1+Math.floor(rnd()*2),p:rnd()*TAU,h:[190,235,265,320][Math.floor(rnd()*4)],s:1.5+rnd()*3}));
const pos=(n,t)=>{const a=TAU*n.k*t/T+n.p;return [n.bx+Math.cos(a)*n.r,n.by+Math.sin(a*1)*n.r]};
const edges=[]; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=pos(nodes[i],0),b=pos(nodes[j],0);if(Math.hypot(a[0]-b[0],a[1]-b[1])<210)edges.push([i,j]);}
const packets=Array.from({length:26},()=>({e:Math.floor(rnd()*edges.length),m:1+Math.floor(rnd()*2),p:rnd(),h:[190,265,320][Math.floor(rnd()*3)]}));
function blob(cx,cy,r,col){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);}
window.render=function(t){
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f2f6ff');g.addColorStop(.5,'#e8f0ff');g.addColorStop(1,'#f3ebff');x.fillStyle=g;x.fillRect(0,0,W,H);
  const a=TAU*t/T;
  blob(W*.78+Math.cos(a)*90,H*.35+Math.sin(a)*60,520,'rgba(34,211,238,.38)');
  blob(W*.55+Math.sin(a)*120,H*.8+Math.cos(a)*40,560,'rgba(139,92,246,.30)');
  blob(W*.9+Math.cos(a+2)*60,H*.85+Math.sin(a+1)*50,420,'rgba(244,114,182,.26)');
  blob(W*.25+Math.sin(a+1)*80,H*.2+Math.cos(a)*50,420,'rgba(99,102,241,.2)');
  // halo rings
  x.save();x.translate(W*.72,H*.5);
  [[250,1,.5],[380,-1,.35],[520,1,.25]].forEach(([r,d,al],i)=>{x.save();x.rotate(d*a);x.strokeStyle='rgba(79,70,229,'+al*.6+')';x.lineWidth=1.5;x.setLineDash([6,14]);x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();x.setLineDash([]);x.fillStyle=i%2?'#a855f7':'#06b6d4';x.shadowColor=x.fillStyle;x.shadowBlur=18;x.beginPath();x.arc(r,0,6,0,TAU);x.fill();x.restore();});
  x.restore();
  const P=nodes.map(n=>pos(n,t));
  x.lineWidth=1.1;
  for(const [i,j] of edges){const d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]);if(d<230){x.strokeStyle='rgba(79,70,229,'+(1-d/230)*.35+')';x.beginPath();x.moveTo(P[i][0],P[i][1]);x.lineTo(P[j][0],P[j][1]);x.stroke();}}
  for(const k of packets){const [i,j]=edges[k.e];const f=((t/T)*k.m+k.p)%1;const px=P[i][0]+(P[j][0]-P[i][0])*f,py=P[i][1]+(P[j][1]-P[i][1])*f;x.fillStyle='hsl('+k.h+',90%,50%)';x.shadowColor=x.fillStyle;x.shadowBlur=14;x.beginPath();x.arc(px,py,3.2,0,TAU);x.fill();}
  x.shadowBlur=0;
  nodes.forEach((n,i)=>{const [px,py]=P[i];x.fillStyle='hsla('+n.h+',85%,55%,.95)';x.beginPath();x.arc(px,py,n.s,0,TAU);x.fill();x.fillStyle='hsla('+n.h+',85%,55%,.14)';x.beginPath();x.arc(px,py,n.s*3.4,0,TAU);x.fill();});
};
render(0);
</script>
