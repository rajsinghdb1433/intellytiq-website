<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#0a0f26}canvas{display:block}</style><canvas id="c" width="1280" height="720"></canvas>
<script>
// Dark "pipeline console" loop, period T=10s, all state derived from t.
const T=10, W=1280, H=720, c=document.getElementById('c'), x=c.getContext('2d'), TAU=Math.PI*2;
const F='"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif', M='"DejaVu Sans Mono",Menlo,Consolas,monospace';
const steps=['Ingest sources','Validate schema','Bronze: raw','Silver: cleansed','Gold: curated','Publish to BI'];
const stages=[['Sources',470,370],['Ingest',612,250],['Bronze',754,370],['Silver',896,250],['Gold',1038,370],['BI',1172,250]];
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);}
function fade(p){return p<.04?p/.04:p>.94?(1-p)/.06:1;}
window.render=function(t){
  const p=(t%T)/T, a=TAU*t/T, fa=fade(p);
  const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1030');bg.addColorStop(1,'#10153f');x.fillStyle=bg;x.fillRect(0,0,W,H);
  [[1000,100,420,'rgba(99,102,241,.35)'],[200,650,380,'rgba(6,182,212,.25)']].forEach(([cx,cy,r,col])=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);});
  // window chrome
  x.fillStyle='rgba(255,255,255,.06)';rr(40,36,1200,648,22);x.fill();x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=1.5;x.stroke();
  ['#ff5f57','#febc2e','#28c840'].forEach((col,i)=>{x.fillStyle=col;x.beginPath();x.arc(72+i*22,68,6,0,TAU);x.fill();});
  x.fillStyle='#aab2d5';x.font='600 15px '+M;x.fillText('intellytiq / pipeline: orders_lakehouse',150,74);
  x.fillStyle='rgba(52,211,153,.18)';rr(1062,52,150,32,16);x.fill();x.fillStyle='#34d399';x.font='700 13px '+F;x.fillText('● RUNNING',1090,73);
  // steps list
  const cur=Math.min(5,Math.floor(p/.9*6));
  steps.forEach((sn,i)=>{const y=130+i*58;const done=(p<.9?i<cur:true)*fa+(1-fa)*0;const active=p<.9&&i===cur;
    x.fillStyle='rgba(255,255,255,'+(active?.12:.05)+')';rr(70,y,300,46,14);x.fill();
    if(done>.5||(p>=.9&&fa>.3)){x.fillStyle='#34d399';x.beginPath();x.arc(98,y+23,11,0,TAU);x.fill();x.strokeStyle='#06220f';x.lineWidth=2.6;x.beginPath();x.moveTo(92,y+23);x.lineTo(97,y+28);x.lineTo(105,y+18);x.stroke();}
    else if(active){x.strokeStyle='rgba(129,140,248,.3)';x.lineWidth=3;x.beginPath();x.arc(98,y+23,10,0,TAU);x.stroke();x.strokeStyle='#818cf8';x.beginPath();x.arc(98,y+23,10,a*6,a*6+1.9);x.stroke();}
    else{x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;x.beginPath();x.arc(98,y+23,10,0,TAU);x.stroke();}
    x.fillStyle=active?'#fff':'#b6bddf';x.font=(active?'700 ':'500 ')+'16px '+F;x.fillText(sn,124,y+28);
  });
  // DAG
  x.lineWidth=3;
  for(let i=0;i<stages.length-1;i++){const [,x1,y1]=stages[i],[,x2,y2]=stages[i+1];const g=x.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'rgba(34,211,238,.55)');g.addColorStop(1,'rgba(168,85,247,.55)');x.strokeStyle=g;x.beginPath();x.moveTo(x1+420-420+0,y1);x.lineTo(x2,y2);x.stroke();}
  for(let i=0;i<stages.length-1;i++){const [,x1,y1]=stages[i],[,x2,y2]=stages[i+1];for(let k=0;k<3;k++){const f=((t/T)*2+k/3+i*.13)%1;const px=x1+(x2-x1)*f,py=y1+(y2-y1)*f;x.fillStyle='#fff';x.shadowColor='#67e8f9';x.shadowBlur=16;x.beginPath();x.arc(px,py,4.5,0,TAU);x.fill();}}
  x.shadowBlur=0;
  stages.forEach(([n,sx,sy],i)=>{const act=p<.9&&i<=cur+1&&i>=cur-1?1:0;x.fillStyle='rgba(15,20,55,.92)';rr(sx-50,sy-30,100,60,16);x.fill();const g=x.createLinearGradient(sx-62,sy-34,sx+62,sy+34);g.addColorStop(0,'#22d3ee');g.addColorStop(1,'#a855f7');x.strokeStyle=g;x.lineWidth=act?3:1.5;x.stroke();x.fillStyle='#fff';x.font='700 15px '+F;x.textAlign='center';x.fillText(n,sx,sy+5);x.textAlign='left';});
  // metrics
  const mx=420, my=470;
  x.fillStyle='rgba(255,255,255,.06)';rr(mx,my,380,190,18);x.fill();
  x.fillStyle='#8f98c4';x.font='600 13px '+F;x.fillText('THROUGHPUT  rows / sec',mx+22,my+34);
  x.fillStyle='#fff';x.font='800 40px '+F;x.fillText((1.24+0.09*Math.sin(a*3)).toFixed(2)+'M',mx+22,my+82);
  x.beginPath();for(let i=0;i<=60;i++){const u=i/60;const v=Math.sin(TAU*(u*3+t/T))*.5+Math.sin(TAU*(u*7+2*t/T))*.25;const px=mx+22+u*336,py=my+140-v*30;i?x.lineTo(px,py):x.moveTo(px,py);}
  const sg=x.createLinearGradient(mx,0,mx+380,0);sg.addColorStop(0,'#22d3ee');sg.addColorStop(1,'#a855f7');x.strokeStyle=sg;x.lineWidth=3;x.stroke();
  // ring + cost
  const rx=900, ry=470;x.fillStyle='rgba(255,255,255,.06)';rr(rx,ry,300,190,18);x.fill();
  x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=12;x.beginPath();x.arc(rx+96,ry+98,56,0,TAU);x.stroke();
  const pr=Math.min(1,p/.9);x.strokeStyle='#34d399';x.lineCap='round';x.beginPath();x.arc(rx+96,ry+98,56,-Math.PI/2,-Math.PI/2+TAU*pr*fa);x.stroke();x.lineCap='butt';
  x.fillStyle='#fff';x.font='800 24px '+F;x.textAlign='center';x.fillText(Math.round(pr*fa*100)+'%',rx+96,ry+106);x.textAlign='left';
  x.fillStyle='#8f98c4';x.font='600 12px '+F;x.fillText('DATA QUALITY',rx+176,ry+70);x.fillStyle='#34d399';x.font='800 22px '+F;x.fillText('99.9%',rx+176,ry+98);
  x.fillStyle='#8f98c4';x.font='600 12px '+F;x.fillText('COST vs LAST RUN',rx+176,ry+132);x.fillStyle='#67e8f9';x.font='800 22px '+F;x.fillText('-23%',rx+176,ry+160);
  // code
  x.fillStyle='#7f89b8';x.font='500 12.5px '+M;
  const code=['df = spark.readStream.table("bronze.orders")','clean = df.dropDuplicates(["order_id"])','clean.writeStream.toTable("silver.orders")'];
  code.forEach((l,i)=>{const n=Math.floor(Math.max(0,Math.min(1,(p*1.2-i*.22)/.2))*l.length);x.fillStyle=i===code.length-1?'#a5b4fc':'#7f89b8';x.fillText(l.slice(0,n),70,y0(i));});function y0(i){return 520+i*26;}
};
render(0);
</script>
